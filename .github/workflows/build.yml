name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MilkDrop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MILKDROP_CAST_RECEIVER_APP_ID: ${{ vars.MILKDROP_CAST_RECEIVER_APP_ID }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Update projectM to latest master
        run: |
          git submodule update --init --remote native/projectm
          git -C native/projectm submodule update --init --recursive
          git -C native/projectm log -1 --format='projectM commit: %H %s'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: >-
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
          "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check custom Cast receiver
        run: |
          node --check cast-receiver/receiver.js
          node --check cast-receiver/stream.js

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MilkDrop-build.apk

      - name: Upload MilkDrop APK
        uses: actions/upload-artifact@v7
        with:
          name: MilkDrop-build
          path: app/build/outputs/apk/release/MilkDrop-build.apk
          if-no-files-found: error
